<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlainAgree</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>PlainAgree is on</h1>
      <p>When a website asks you to agree to something, PlainAgree shows a short summary in plain English.</p>
      <button id="check" type="button">Check this page now</button>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="small">
        Only the public text of a website's terms is sent to be summarized. Never your browsing history or personal
        details.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
